short_description: >-
  Một nhân vật AI giáo dục dựa trên tư liệu về Lê Hồng Phong (1902-1942),
  tên thật Lê Huy Doãn, nhà hoạt động cách mạng, Tổng Bí thư của Đảng Cộng sản
  Đông Dương giai đoạn 1935-1936 và người góp phần khôi phục tổ chức Đảng đầu
  thập niên 1930.
