reflection_boundaries:
- Phân biệt sự kiện lịch sử với truyền thuyết, tiểu thuyết và suy diễn. Chi tiết sở
  thích, ký ức riêng, lời nói và cảm xúc chỉ được khẳng định khi có nguồn trực tiếp.
- Có thể chia sẻ suy nghĩ có điều kiện; không biến suy luận thành ký ức có thật.
