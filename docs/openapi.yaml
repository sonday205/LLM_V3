openapi: 3.1.0
info:
  title: Historical Character Hybrid RAG API
  summary: API nhân vật lịch sử với RAG, memory an toàn và voice STT
  description: Hybrid RAG bằng PostgreSQL/pgvector, memory bền vững 7 ngày, hai precheck cục bộ và đúng
    một generation call cho mỗi chat hợp lệ. Voice push-to-talk dùng WebSocket nên được mô tả riêng ngoài
    OpenAPI.
  version: 1.2.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - system
      summary: Ready
      operationId: getReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/characters:
    get:
      tags:
      - characters
      summary: List Characters
      operationId: listCharacters
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CharacterSummary'
                type: array
                title: Response Listcharacters
      security:
      - ApplicationApiKey: []
  /v1/characters/{character_id}/chat:
    post:
      tags:
      - chat
      summary: Chat
      operationId: chatWithCharacter
      security:
      - ApplicationApiKey: []
      parameters:
      - name: character_id
        in: path
        required: true
        schema:
          type: string
          title: Character Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/characters/{character_id}/sessions/{session_id}:
    delete:
      tags:
      - chat
      summary: Reset Session
      operationId: resetCharacterSession
      security:
      - ApplicationApiKey: []
      parameters:
      - name: character_id
        in: path
        required: true
        schema:
          type: string
          title: Character Id
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResetResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CharacterSummary:
      properties:
        id:
          type: string
          title: Id
        sort_order:
          type: integer
          title: Sort Order
        display_name:
          type: string
          title: Display Name
        self_pronoun:
          type: string
          title: Self Pronoun
        student_pronoun:
          type: string
          title: Student Pronoun
        short_description:
          type: string
          title: Short Description
      type: object
      required:
      - id
      - sort_order
      - display_name
      - self_pronoun
      - student_pronoun
      - short_description
      title: CharacterSummary
    ChatRequest:
      properties:
        session_id:
          type: string
          maxLength: 120
          minLength: 8
          title: Session Id
        message:
          type: string
          maxLength: 2000
          minLength: 1
          title: Message
        debug:
          type: boolean
          title: Debug
          default: false
      type: object
      required:
      - session_id
      - message
      title: ChatRequest
      examples:
      - debug: false
        message: Chú sinh năm bao nhiêu?
        session_id: demo-session-001
    ChatResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        character_id:
          type: string
          title: Character Id
        answer:
          type: string
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/SourceResponse'
          type: array
          title: Sources
        memory_used:
          type: boolean
          title: Memory Used
          default: false
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        provider_call_count:
          type: integer
          maximum: 1.0
          minimum: 0.0
          title: Provider Call Count
        degraded:
          type: boolean
          title: Degraded
          default: false
        blocked_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Blocked Category
        timings_ms:
          additionalProperties:
            type: integer
          type: object
          title: Timings Ms
        usage:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: integer
              - type: 'null'
            type: object
          - type: 'null'
          title: Usage
        debug:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Debug
      type: object
      required:
      - request_id
      - character_id
      - answer
      - provider_call_count
      title: ChatResponse
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
        service:
          type: string
          title: Service
        database_ready:
          type: boolean
          title: Database Ready
        corpus_ready:
          type: boolean
          title: Corpus Ready
        llm_model:
          type: string
          title: Llm Model
        embedding_provider:
          type: string
          title: Embedding Provider
        stt_configured:
          type: boolean
          title: Stt Configured
      type: object
      required:
      - status
      - service
      - database_ready
      - corpus_ready
      - llm_model
      - embedding_provider
      - stt_configured
      title: HealthResponse
    SessionResetResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        deleted:
          type: boolean
          title: Deleted
      type: object
      required:
      - session_id
      - deleted
      title: SessionResetResponse
    SourceResponse:
      properties:
        chunk_id:
          type: string
          title: Chunk Id
        document_id:
          type: string
          title: Document Id
        title:
          type: string
          title: Title
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        evidence_scope:
          type: string
          enum:
          - character
          - contextual
          title: Evidence Scope
          default: character
        score:
          type: number
          title: Score
      type: object
      required:
      - chunk_id
      - document_id
      - title
      - source_name
      - source_url
      - score
      title: SourceResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApplicationApiKey:
      type: apiKey
      description: API key của ứng dụng gọi Historical Character RAG API.
      in: header
      name: X-API-Key
